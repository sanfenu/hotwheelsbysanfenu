<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Wheels Collection by sanfenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     1. VARIABLES DE COLOR Y TIPOGRAFÍA
     Cambia estos valores si quieres retocar la paleta de colores
     ============================================================ */
  :root{
    --rojo: #E63946;
    --azul: #0077C8;
    --amarillo: #FFC72C;
    --naranja: #F4A300;
    --dorado: #D4AF37;
    --dorado-claro: #F3E3A8;
    --carbon: #1B1B2F;
    --carbon-suave: #2B2B45;
    --blanco: #FFFFFF;
    --gris-claro: #F6F4EE;
    --gris-medio: #D9D5C7;
    --fuente-titular: 'Bungee', cursive;
    --fuente-texto: 'Poppins', sans-serif;
    --radio: 16px;
    --sombra: 0 10px 25px rgba(27,27,47,.25);

    /* estas son las que cambian entre modo claro y modo oscuro */
    --superficie-pagina: var(--gris-claro);
    --superficie-tarjeta: var(--blanco);
    --superficie-hover: #fff8e6;
    --texto-principal: var(--carbon);
    --texto-secundario: var(--carbon-suave);
    --borde-suave: var(--gris-medio);
    --chip-fondo: var(--gris-claro);
  }

  body.modo-oscuro{
    --superficie-pagina: #14141f;
    --superficie-tarjeta: #20212f;
    --superficie-hover: #2b2c40;
    --texto-principal: #f3f1e8;
    --texto-secundario: #b6b3c4;
    --borde-suave: #383a52;
    --chip-fondo: #2a2b3d;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    font-family:var(--fuente-texto);
    background:var(--superficie-pagina);
    color:var(--texto-principal);
    transition:background .3s ease, color .3s ease;
  }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; }

  :focus-visible{
    outline:3px solid var(--dorado);
    outline-offset:2px;
  }

  /* franja de bandera de cuadros, motivo decorativo reutilizado */
  .bandera-cuadros{
    height:14px;
    background-image:
      repeating-linear-gradient(45deg, var(--carbon) 0 10px, var(--blanco) 10px 20px);
    background-size:20px 20px;
  }

  /* ============================================================
     2. ENCABEZADO / LOGOTIPO (se repite en todas las vistas)
     ============================================================ */
  .cabecera{
    background:linear-gradient(135deg, var(--carbon) 0%, var(--carbon-suave) 100%);
    padding:18px 20px 22px;
    text-align:center;
    position:relative;
  }
  .logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    line-height:1;
  }
  .logo .l1{
    font-family:var(--fuente-titular);
    font-size:clamp(1.8rem, 6vw, 3.2rem);
    background:linear-gradient(180deg, #FFF6D8 0%, #FFD700 45%, #C9971A 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-stroke:1.5px var(--carbon);
    text-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 22px rgba(255,215,0,.55);
    letter-spacing:2px;
  }
  .logo .l2{
    font-family:var(--fuente-titular);
    font-size:clamp(1rem, 3.4vw, 1.7rem);
    letter-spacing:6px;
    background:linear-gradient(90deg, var(--dorado-claro), var(--dorado), var(--dorado-claro));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-top:4px;
  }
  .logo .firma{
    font-family:var(--fuente-texto);
    font-style:italic;
    font-weight:500;
    color:var(--gris-claro);
    font-size:.95rem;
    margin-top:6px;
    opacity:.9;
  }
  .cabecera.pequena{ padding:14px 16px; }
  .cabecera.pequena .l1{ font-size:clamp(1.3rem,5vw,1.9rem); -webkit-text-stroke:1.5px var(--carbon); text-shadow:2px 2px 0 var(--rojo);}
  .cabecera.pequena .l2{ font-size:clamp(.7rem,2.6vw,1rem); letter-spacing:4px; }
  .cabecera.pequena .firma{ font-size:.75rem; }

  /* ============================================================
     3. VISTA HOME: rueda de coches girando + botón ENTER
     ============================================================ */
  #vista-home{
    min-height:100vh;
    background:radial-gradient(circle at 50% 25%, #4DA3E8 0%, #1D7FE0 55%, #0F5DA8 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
    color:var(--blanco);
  }
  #vista-home .logo .l1{ font-size:clamp(2.4rem, 9vw, 4.6rem); }
  #vista-home .logo .l2{ font-size:clamp(1.1rem, 4vw, 2rem); }
  #vista-home .logo .firma{ font-size:1.1rem; margin-bottom:10px; }

  .centro-rueda{
    position:relative;
    width:110px; height:110px;
    margin:8px auto 0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--dorado-claro), var(--dorado) 70%, #9c7a1f 100%);
    border:4px solid var(--carbon);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 6px rgba(212,175,55,.25);
  }
  .btn-enter{
    background:var(--rojo);
    color:var(--blanco);
    border:3px solid var(--dorado);
    font-family:var(--fuente-titular);
    font-size:1.15rem;
    letter-spacing:2px;
    width:100%; height:100%;
    border-radius:50%;
    animation:pulso 2s ease-in-out infinite;
  }
  .btn-enter:hover{ background:#c62533; }

  /* escenario horizontal: los coches van saliendo de uno en uno y giran en 3D */
  .escenario-3d{
    perspective:900px;
    overflow:hidden;
    width:min(240px, 70vw);
    height:150px;
    margin:26px auto 6px;
    position:relative;
  }
  .escenario-3d::after{
    content:"";
    position:absolute; left:0; right:0; bottom:14px; height:10px;
    background:radial-gradient(ellipse at center, rgba(212,175,55,.35), transparent 70%);
  }
  .pista-3d{
    display:flex;
    height:100%;
    transition:transform .8s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  .item-3d{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .icono-3d{
    font-size:4.6rem;
    display:inline-block;
    transform-style:preserve-3d;
    filter:drop-shadow(0 10px 8px rgba(0,0,0,.45));
  }
  .icono-3d.girando{
    animation:giro3d 2.5s ease-in-out;
  }
  .icono-3d.foto{
    width:150px; height:150px;
    object-fit:contain;
    filter:drop-shadow(0 10px 10px rgba(0,0,0,.5));
  }

  @keyframes giro3d{
    0%{ transform:scale(.72); opacity:.3; }
    55%{ transform:scale(1.1); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes pulso{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }

  .home-sub{
    max-width:480px;
    color:var(--blanco);
    font-size:.95rem;
    opacity:.95;
    margin-top:14px;
    text-shadow:0 1px 3px rgba(0,0,0,.35);
  }

  @media (prefers-reduced-motion: reduce){
    .btn-enter, .icono-3d.girando, .pista-3d{ animation:none; transition:none; }
  }

  /* ============================================================
     4. VISTA LISTADO
     ============================================================ */
  #vista-listado{ display:none; }
  .barra-listado{
    background:var(--superficie-tarjeta);
    padding:16px 20px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    border-bottom:3px solid var(--dorado);
    position:sticky; top:0; z-index:5;
  }
  .btn-volver-home{
    background:none; border:2px solid var(--texto-principal); color:var(--texto-principal);
    border-radius:999px; padding:8px 16px; font-weight:600; font-size:.85rem;
    display:flex; align-items:center; gap:6px;
  }
  .btn-volver-home:hover{ background:var(--texto-principal); color:var(--superficie-tarjeta); }
  .btn-icono-redondo{
    background:var(--chip-fondo); border:2px solid var(--borde-suave); color:var(--texto-principal);
    width:38px; height:38px; border-radius:50%; font-size:1.1rem;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .btn-icono-redondo:hover{ border-color:var(--dorado); }
  .btn-estadisticas{
    background:none; border:2px solid var(--dorado); color:var(--texto-principal);
    border-radius:999px; padding:8px 14px; font-weight:600; font-size:.82rem;
    display:flex; align-items:center; gap:6px;
  }
  .btn-estadisticas:hover{ background:var(--dorado); color:var(--carbon); }
  .buscador{
    flex:1;
    min-width:220px;
    display:flex;
    align-items:center;
    background:var(--chip-fondo);
    border:2px solid var(--borde-suave);
    border-radius:999px;
    padding:6px 16px;
    gap:8px;
  }
  .buscador:focus-within{ border-color:var(--dorado); }
  .buscador input{
    border:none; background:none; outline:none;
    font-family:var(--fuente-texto); font-size:1rem;
    flex:1; padding:6px 0; color:var(--texto-principal);
  }
  .contador{
    font-size:.85rem; color:var(--texto-secundario); font-weight:600;
    white-space:nowrap;
  }

  .fila-filtros{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:12px 20px; background:var(--superficie-tarjeta);
    border-bottom:1px solid var(--borde-suave);
  }
  .fila-filtros label{
    font-size:.75rem; font-weight:700; color:var(--texto-secundario);
    display:flex; flex-direction:column; gap:4px;
  }
  .fila-filtros select{
    font-family:var(--fuente-texto); font-size:.9rem;
    padding:8px 10px; border-radius:10px;
    border:2px solid var(--borde-suave); background:var(--chip-fondo);
    color:var(--texto-principal); min-width:140px;
  }
  .fila-filtros select:focus-visible{ border-color:var(--dorado); }
  .check-favoritos{
    flex-direction:row !important;
    align-items:center; gap:6px !important;
    font-size:.85rem !important; color:var(--texto-principal) !important;
    cursor:pointer; padding-top:14px;
  }
  .check-favoritos input{ width:16px; height:16px; accent-color:var(--dorado); cursor:pointer; }
  .btn-limpiar-filtros{
    background:none; border:none; color:var(--rojo); font-weight:600;
    font-size:.85rem; align-self:flex-end; padding:8px 4px;
  }
  .btn-limpiar-filtros:hover{ text-decoration:underline; }

  .panel-estadisticas{
    display:none;
    background:var(--superficie-tarjeta);
    padding:16px 20px 20px;
    border-bottom:1px solid var(--borde-suave);
    gap:26px; flex-wrap:wrap;
  }
  .stat-grupo h4{
    margin:0 0 8px; font-size:.75rem; text-transform:uppercase;
    letter-spacing:1px; color:var(--dorado); font-weight:700;
  }
  .stat-lista{ display:flex; flex-wrap:wrap; gap:6px; max-width:520px; }
  .chip-stat{
    background:var(--chip-fondo); border:1px solid var(--borde-suave);
    border-radius:999px; padding:4px 12px; font-size:.78rem; color:var(--texto-secundario);
  }
  .chip-stat b{ color:var(--texto-principal); margin-left:5px; }

  .abecedario{
    display:flex; flex-wrap:wrap; gap:6px;
    padding:12px 20px; background:var(--chip-fondo);
    border-bottom:1px solid var(--borde-suave);
  }
  .abecedario button{
    background:var(--superficie-tarjeta); border:1.5px solid var(--borde-suave); color:var(--texto-principal);
    width:30px; height:30px; border-radius:8px; font-weight:700; font-size:.8rem;
  }
  .abecedario button:hover{ border-color:var(--dorado); color:var(--dorado); }

  .controles-paginacion{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:6px; padding:20px 16px 50px;
  }
  .btn-pagina{
    min-width:36px; height:36px; padding:0 8px;
    border-radius:8px; border:2px solid var(--borde-suave);
    background:var(--superficie-tarjeta); color:var(--texto-principal);
    font-weight:600; font-size:.9rem;
  }
  .btn-pagina:hover:not(:disabled){ border-color:var(--dorado); color:var(--dorado); }
  .btn-pagina.activa{ background:var(--dorado); border-color:var(--dorado); color:var(--carbon); }
  .btn-pagina:disabled{ opacity:.35; }
  .puntos-pagina{ color:var(--texto-secundario); padding:0 4px; }

  .btn-arriba{
    position:fixed; right:22px; bottom:22px; z-index:20;
    width:50px; height:50px; border-radius:50%;
    background:var(--dorado); color:var(--carbon);
    border:3px solid var(--carbon); font-size:1.3rem;
    box-shadow:var(--sombra);
    opacity:0; pointer-events:none; transform:translateY(12px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .btn-arriba.visible{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .btn-arriba:hover{ background:var(--dorado-claro); }

  .contenido-listado{ max-width:900px; margin:0 auto; padding:10px 16px 60px; }

  .letra-titulo{
    font-family:var(--fuente-titular);
    color:var(--blanco);
    background:var(--azul);
    display:inline-block;
    padding:4px 16px;
    border-radius:8px 8px 0 0;
    font-size:1.1rem;
    margin-top:26px;
  }
  .grupo-letra{ border-bottom:2px solid var(--borde-suave); }

  .fila-coche{
    display:flex;
    align-items:center;
    gap:6px;
    width:100%;
    background:var(--superficie-tarjeta);
    border-bottom:1px solid var(--borde-suave);
    padding:8px 8px 8px 12px;
    border-radius:10px;
    margin:6px 0;
  }
  .fila-coche:hover{ background:var(--superficie-hover); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .fila-click{
    display:flex; align-items:center; gap:14px; flex:1; min-width:0;
    background:none; border:none; text-align:left; padding:2px 0; color:inherit; font:inherit;
  }
  .fila-click img{
    width:84px; height:60px; object-fit:cover;
    background:var(--chip-fondo); border-radius:8px; border:2px solid var(--dorado-claro);
    flex-shrink:0;
  }
  .fila-info{ flex:1; min-width:0; }
  .fila-nombre{ font-weight:600; font-size:1rem; margin:0 0 2px; color:var(--texto-principal); }
  .fila-meta{ font-size:.8rem; color:var(--texto-secundario); margin:0; }
  .fila-flecha{ color:var(--dorado); font-size:1.4rem; flex-shrink:0; }
  .btn-estrella{
    background:none; border:none; font-size:1.4rem; line-height:1;
    color:var(--borde-suave); padding:8px; flex-shrink:0;
  }
  .btn-estrella.activa{ color:var(--dorado); }
  .btn-estrella:hover{ transform:scale(1.15); }

  .sin-resultados{
    text-align:center; padding:60px 20px; color:var(--texto-secundario);
  }

  /* ============================================================
     5. VISTA FICHA DE COCHE
     ============================================================ */
  #vista-ficha{ display:none; }
  .contenido-ficha{
    max-width:640px; margin:0 auto; padding:24px 18px 70px;
  }
  .btn-volver-listado{
    background:none; border:none; color:var(--azul); font-weight:600;
    font-size:.95rem; margin-bottom:16px; display:flex; align-items:center; gap:6px;
    padding:6px 0;
  }
  .tarjeta-ficha{
    background:var(--superficie-tarjeta);
    border-radius:var(--radio);
    box-shadow:var(--sombra);
    overflow:hidden;
    border:3px solid var(--dorado);
  }
  .ficha-foto-wrap{
    position:relative;
    /* Para poner tu propia foto de carretera o circuito de fondo:
       1) guarda tu foto en la carpeta "imagenes" (ej: imagenes/fondo-circuito.jpg)
       2) cambia la ruta que hay aquí abajo, en la primera línea de "background"
       Mientras no pongas ninguna, se ve el fondo de circuito dibujado. */
    background:
      linear-gradient(180deg, rgba(20,20,32,0) 55%, var(--superficie-tarjeta) 100%),
      url("imagenes/fondo-circuito.jpg") center / cover no-repeat,
      repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 26px, transparent 26px 52px) center 84% / 52px 6px no-repeat,
      linear-gradient(180deg, #9fbfd8 0%, #9fbfd8 26%, #6d7278 26%, #45484d 62%, #2b2d30 100%);
    padding:40px 26px 22px;
    min-height:270px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    overflow:hidden;
  }
  .ficha-foto-wrap img{
    position:relative;
    max-height:230px; max-width:100%;
    border-radius:8px;
    filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));
  }
  .btn-estrella-ficha{
    position:absolute; top:22px; right:16px; z-index:2;
    background:rgba(27,27,47,.55); border:2px solid var(--dorado-claro);
    color:var(--dorado-claro); width:42px; height:42px; border-radius:50%;
    font-size:1.4rem; display:flex; align-items:center; justify-content:center;
  }
  .btn-estrella-ficha.activa{ color:var(--dorado); background:rgba(27,27,47,.75); }
  .ficha-cuerpo{ padding:22px 24px 28px; }
  .ficha-nombre{
    font-family:var(--fuente-titular);
    font-size:1.6rem;
    color:var(--texto-principal);
    margin:0 0 12px;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .chip{
    background:var(--chip-fondo);
    border:1.5px solid var(--borde-suave);
    border-radius:999px;
    padding:5px 14px;
    font-size:.8rem;
    font-weight:600;
    color:var(--texto-secundario);
  }
  .chip.dorado{ border-color:var(--dorado); background:var(--dorado-claro); color:#5c4813; }
  .chip.color-chip{ display:inline-flex; align-items:center; gap:6px; }
  .punto-color{
    width:12px; height:12px; border-radius:50%;
    display:inline-block; border:1px solid rgba(0,0,0,.25);
  }
  .ficha-resena{
    font-size:1rem; line-height:1.65; color:var(--texto-principal);
  }
  .ficha-resena h3{
    font-family:var(--fuente-texto); font-size:.85rem; text-transform:uppercase;
    letter-spacing:1px; color:var(--dorado); margin:0 0 6px;
  }
  .nav-ficha{
    display:flex; justify-content:space-between; gap:10px; margin-top:22px;
  }
  .nav-ficha button{
    flex:1;
    background:var(--carbon); color:var(--blanco);
    border:none; border-radius:10px; padding:12px 10px; font-weight:600; font-size:.85rem;
  }
  .nav-ficha button:disabled{ opacity:.3; cursor:default; }
  .nav-ficha button:not(:disabled):hover{ background:var(--rojo); }

</style>
</head>
<body>

<!-- ================================================================
     VISTA 1: HOME
     ================================================================ -->
<section id="vista-home">
  <div class="logo">
    <span class="l1">HOT WHEELS</span>
    <span class="l2">COLLECTION</span>
    <span class="firma">by sanfenu</span>
  </div>

  <div class="centro-rueda">
    <button class="btn-enter" id="btn-enter" aria-label="Entrar al listado de la colección">ENTER</button>
  </div>

  <div class="escenario-3d" aria-hidden="true">
    <div class="pista-3d" id="pista-3d"></div>
  </div>

  <p class="home-sub">Pulsa ENTER para ver el listado completo de la colección, buscar por nombre y abrir la ficha de cada coche.</p>
</section>

<!-- ================================================================
     VISTA 2: LISTADO
     ================================================================ -->
<section id="vista-listado">
  <header class="cabecera pequena">
    <div class="logo">
      <span class="l1">HOT WHEELS</span>
      <span class="l2">COLLECTION</span>
      <span class="firma">by sanfenu</span>
    </div>
  </header>
  <div class="bandera-cuadros"></div>

  <div class="barra-listado">
    <button class="btn-volver-home" id="btn-volver-home">&#8592; Inicio</button>
    <div class="buscador">
      <span aria-hidden="true">&#128269;</span>
      <input type="text" id="buscador-input" placeholder="Buscar coche por nombre..." aria-label="Buscar coche por nombre">
    </div>
    <span class="contador" id="contador-coches"></span>
    <button class="btn-estadisticas" id="btn-estadisticas" type="button">&#128202; Estadísticas</button>
    <button class="btn-icono-redondo" id="btn-modo-oscuro" type="button" aria-label="Cambiar entre modo claro y oscuro">&#127769;</button>
  </div>

  <div class="panel-estadisticas" id="panel-estadisticas"></div>

  <div class="fila-filtros">
    <label>Marca
      <select id="filtro-marca"><option value="">Todas</option></select>
    </label>
    <label>Serie

let listaActual = [];
let cocheFichaActualId = null;
let paginaActual = 1;
let cochesPorPagina = 15;

/* ---------- favoritos (se guardan en este navegador, con localStorage) ---------- */
let favoritos = [];
function cargarFavoritos(){
  try{ favoritos = JSON.parse(localStorage.getItem("hw_favoritos")) || []; }
  catch(err){ favoritos = []; }
}
function guardarFavoritos(){
  try{ localStorage.setItem("hw_favoritos", JSON.stringify(favoritos)); }
  catch(err){ /* si el navegador bloquea el almacenamiento local, no pasa nada */ }
}
function esFavorito(id){ return favoritos.includes(id); }
function alternarFavorito(id){
  favoritos = esFavorito(id) ? favoritos.filter(f => f !== id) : [...favoritos, id];
  guardarFavoritos();
  listaActual = calcularListaFiltrada();
  pintarPaginaListado();
  if(cocheFichaActualId === id){
    const btn = document.getElementById("btn-favorito-ficha");
    if(btn){
      const fav = esFavorito(id);
      btn.classList.toggle("activa", fav);
      btn.textContent = fav ? "\u2605" : "\u2606";
    }
  }
}

/* ---------- modo oscuro (se recuerda también entre visitas) ---------- */
function aplicarModoOscuro(activo){
  document.body.classList.toggle("modo-oscuro", activo);
  document.getElementById("btn-modo-oscuro").textContent = activo ? "\u2600\uFE0F" : "\u{1F319}";
  try{ localStorage.setItem("hw_modo_oscuro", activo ? "1" : "0"); }
  catch(err){ /* si el navegador bloquea el almacenamiento local, no pasa nada */ }
}
function cargarModoOscuro(){
  let activo = false;
  try{ activo = localStorage.getItem("hw_modo_oscuro") === "1"; }
  catch(err){ activo = false; }
  aplicarModoOscuro(activo);
}

function generarMiniatura(color){
  const c = encodeURIComponent(color || "#999999");
  return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 60'%3E%3Cpath d='M10 40 Q15 20 35 20 L62 20 Q84 20 90 40 L90 47 Q90 51 86 51 L14 51 Q10 51 10 47 Z' fill='" + c + "' stroke='%231b1b2f' stroke-width='2'/%3E%3Ccircle cx='27' cy='49' r='7' fill='%231b1b2f'/%3E%3Ccircle cx='73' cy='49' r='7' fill='%231b1b2f'/%3E%3Ccircle cx='27' cy='49' r='2.5' fill='%23D4AF37'/%3E%3Ccircle cx='73' cy='49' r='2.5' fill='%23D4AF37'/%3E%3C/svg%3E";
}

function fotoDe(coche){
  return (coche.foto && coche.foto.trim() !== "") ? coche.foto : generarMiniatura(coche.color);
}

function primeraLetra(nombre){
  const m = nombre.match(/[A-Za-zÀ-ÿ0-9]/);
  return m ? m[0].toUpperCase() : "#";
}

function normaliza(txt){
  return (txt || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function listaColores(coche){
  return (coche.colorNombre || "").split(",").map(c => c.trim()).filter(Boolean);
}

function listaSeries(coche){
  return (coche.serie || "").split(",").map(s => s.trim()).filter(Boolean);
}

/* ---------- escenario 3D de la home: los coches salen de uno en uno ---------- */
function construirEscenario3D(){
  const iconosBase = ["\u{1F697}", "\u{1F3CE}\uFE0F", "\u{1F699}", "\u{1F695}", "\u{1F696}", "\u{1F693}", "\u{1F69B}", "\u{1F68C}"];
  const totalPosiciones = Math.max(fotosPortada.length, iconosBase.length);
  const pista = document.getElementById("pista-3d");
  const escenario = pista.parentElement;
  const anchoItem = escenario.clientWidth;

  function crearVisual(indice){
    const ruta = fotosPortada[indice % fotosPortada.length];
    if(ruta && ruta.trim() !== ""){
      const img = document.createElement("img");
      img.className = "icono-3d foto";
      img.src = ruta;
      img.alt = "Coche destacado de la colección";
      return img;
    }
    const span = document.createElement("span");
    span.className = "icono-3d";
    span.textContent = iconosBase[indice % iconosBase.length];
    return span;
  }

  // se añade al final una copia de la primera posición para que el bucle sea continuo
  const totalItems = totalPosiciones + 1;

  for(let i = 0; i < totalItems; i++){
    const indiceReal = (i === totalItems - 1) ? 0 : i;
    const item = document.createElement("div");
    item.className = "item-3d";
    item.style.width = anchoItem + "px";
    item.appendChild(crearVisual(indiceReal));
    pista.appendChild(item);
  }

  const reducirMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let indice = 0;

  function girarActual(){
    const iconoActual = pista.children[indice].querySelector(".icono-3d");
    iconoActual.classList.remove("girando");
    void iconoActual.offsetWidth;
    iconoActual.classList.add("girando");
  }

  function avanzar(){
    if(reducirMovimiento) return;
    indice++;
    pista.style.transition = "transform .8s cubic-bezier(.4,0,.2,1)";
    pista.style.transform = "translateX(-" + (indice * anchoItem) + "px)";

    setTimeout(() => {
      if(indice === totalItems - 1){
        // salto invisible del clon final al coche real inicial, sin transición
        indice = 0;
        pista.style.transition = "none";
        pista.style.transform = "translateX(0px)";
        void pista.offsetWidth;
      }
      girarActual();
      setTimeout(avanzar, 2600);
    }, 820);
  }

  girarActual();
  if(!reducirMovimiento) setTimeout(avanzar, 2600);
}

/* ---------- navegación entre vistas ---------- */
function mostrarVista(id){
  document.getElementById("vista-home").style.display = (id === "home") ? "flex" : "none";
  document.getElementById("vista-listado").style.display = (id === "listado") ? "block" : "none";
  document.getElementById("vista-ficha").style.display = (id === "ficha") ? "block" : "none";
  window.scrollTo(0, 0);
}

/* ---------- listado ---------- */
function poblarFiltros(){
  const contarPor = (obtenerValor) => {
    const conteo = {};
    coches.forEach(c => {
      const valor = obtenerValor(c);
      if(valor === undefined || valor === null || valor === "") return;
      const clave = String(valor);
      conteo[clave] = (conteo[clave] || 0) + 1;
    });
    return conteo;
  };

  const conteoMarca = contarPor(c => c.marca);
  const conteoAnio = contarPor(c => c.anio);
  const conteoSerie = {};
  coches.forEach(c => listaSeries(c).forEach(s => { conteoSerie[s] = (conteoSerie[s] || 0) + 1; }));
  const conteoColor = {};
  coches.forEach(c => listaColores(c).forEach(col => { conteoColor[col] = (conteoColor[col] || 0) + 1; }));

  const marcas = Object.keys(conteoMarca).sort();
  const series = Object.keys(conteoSerie).sort();
  const anios = Object.keys(conteoAnio).sort((a, b) => a - b);
  const colores = Object.keys(conteoColor).sort();

  const selMarca = document.getElementById("filtro-marca");
  const selSerie = document.getElementById("filtro-serie");
  const selAnio = document.getElementById("filtro-anio");
  const selColor = document.getElementById("filtro-color");

  marcas.forEach(m => selMarca.insertAdjacentHTML("beforeend", '<option value="' + m + '">' + m + ' (' + conteoMarca[m] + ')</option>'));
  series.forEach(s => selSerie.insertAdjacentHTML("beforeend", '<option value="' + s + '">' + s + ' (' + conteoSerie[s] + ')</option>'));
  anios.forEach(a => selAnio.insertAdjacentHTML("beforeend", '<option value="' + a + '">' + a + ' (' + conteoAnio[a] + ')</option>'));
  colores.forEach(c => selColor.insertAdjacentHTML("beforeend", '<option value="' + c + '">' + c + ' (' + conteoColor[c] + ')</option>'));
}

function calcularListaFiltrada(){
  const q = normaliza(document.getElementById("buscador-input").value);
  const marca = document.getElementById("filtro-marca").value;
  const serie = document.getElementById("filtro-serie").value;
  const anio = document.getElementById("filtro-anio").value;
  const color = document.getElementById("filtro-color").value;
  const soloFavoritos = document.getElementById("filtro-favoritos").checked;

  return coches
    .filter(c => normaliza(c.nombre).includes(q) || normaliza(c.marca).includes(q) || normaliza(c.serie).includes(q) || normaliza(c.colorNombre).includes(q))
    .filter(c => !marca || c.marca === marca)
    .filter(c => !serie || listaSeries(c).some(s => normaliza(s) === normaliza(serie)))
    .filter(c => !anio || String(c.anio) === anio)
    .filter(c => !color || listaColores(c).some(col => normaliza(col) === normaliza(color)))
    .filter(c => !soloFavoritos || esFavorito(c.id))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, "es", {sensitivity:"base"}));
}

/* se llama cuando cambian la búsqueda o los filtros: siempre vuelve a la página 1 */
function renderizarListado(){
  listaActual = calcularListaFiltrada();
  paginaActual = 1;
  pintarPaginaListado();
}

function pintarPaginaListado(){
  const contenedor = document.getElementById("contenido-listado");
  const contador = document.getElementById("contador-coches");
  const controles = document.getElementById("controles-paginacion");

  if(listaActual.length === 0){
    contador.textContent = "0 de " + coches.length + " coches";
    contenedor.innerHTML = '<p class="sin-resultados">No se ha encontrado ningún coche con esos criterios.</p>';
    controles.innerHTML = "";
    document.getElementById("abecedario").innerHTML = "";
    return;
  }

  const totalPaginas = Math.max(1, Math.ceil(listaActual.length / cochesPorPagina));
  if(paginaActual > totalPaginas) paginaActual = totalPaginas;
  if(paginaActual < 1) paginaActual = 1;

  const inicio = (paginaActual - 1) * cochesPorPagina;
  const itemsPagina = listaActual.slice(inicio, inicio + cochesPorPagina);

  contador.textContent = listaActual.length + " de " + coches.length + " coches" +
    (totalPaginas > 1 ? " · página " + paginaActual + " de " + totalPaginas : "");

  let letraAnterior = "";
  let html = "";
  itemsPagina.forEach(coche => {
    const letra = primeraLetra(coche.nombre);
    if(letra !== letraAnterior){
      if(letraAnterior !== "") html += "</div>";
      html += '<div class="grupo-letra" id="letra-' + letra + '">';
      html += '<div class="letra-titulo">' + letra + '</div>';
      letraAnterior = letra;
    }
    const meta = [coche.marca, coche.serie, coche.anio].filter(Boolean).join(" · ");
    const fav = esFavorito(coche.id);
    html += '<div class="fila-coche">' +
              '<button class="fila-click" onclick="abrirFicha(' + coche.id + ')">' +
                '<img src="' + fotoDe(coche) + '" alt="Miniatura de ' + coche.nombre + '">' +
                '<span class="fila-info">' +
                  '<p class="fila-nombre">' + coche.nombre + '</p>' +
                  '<p class="fila-meta">' + meta + '</p>' +
                '</span>' +
                '<span class="fila-flecha" aria-hidden="true">&#8250;</span>' +
              '</button>' +
              '<button class="btn-estrella' + (fav ? ' activa' : '') + '" onclick="alternarFavorito(' + coche.id + ')" aria-label="Marcar ' + coche.nombre + ' como favorito">' + (fav ? "\u2605" : "\u2606") + '</button>' +
            '</div>';
  });
  html += "</div>";
  contenedor.innerHTML = html;

  construirAbecedario();
  renderizarControlesPaginacion(totalPaginas);
}

function construirAbecedario(){
  const letras = [...new Set(listaActual.map(c => primeraLetra(c.nombre)))].sort();
  const cont = document.getElementById("abecedario");
  cont.innerHTML = letras.map(l =>
    '<button onclick="irALetra(\'' + l + '\')">' + l + '</button>'
  ).join("");
}

function irALetra(letra){
  const indice = listaActual.findIndex(c => primeraLetra(c.nombre) === letra);
  if(indice === -1) return;
  paginaActual = Math.floor(indice / cochesPorPagina) + 1;
  pintarPaginaListado();
  const el = document.getElementById("letra-" + letra);
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------- paginación: números de página, con puntos suspensivos si hay muchas ---------- */
function paginasAMostrar(actual, total){
  const vecinas = 1;
  const paginas = [];
  for(let p = 1; p <= total; p++){
    if(p === 1 || p === total || (p >= actual - vecinas && p <= actual + vecinas)){
      paginas.push(p);
    } else if(paginas[paginas.length - 1] !== "..."){
      paginas.push("...");
    }
  }
  return paginas;
}

function renderizarControlesPaginacion(totalPaginas){
  const cont = document.getElementById("controles-paginacion");
  if(totalPaginas <= 1){ cont.innerHTML = ""; return; }

  let html = '<button class="btn-pagina" onclick="cambiarPagina(' + (paginaActual - 1) + ')" ' +
             (paginaActual === 1 ? "disabled" : "") + ' aria-label="Página anterior">&#8249;</button>';

  paginasAMostrar(paginaActual, totalPaginas).forEach(p => {
    html += (p === "...")
      ? '<span class="puntos-pagina">&#8230;</span>'
      : '<button class="btn-pagina' + (p === paginaActual ? " activa" : "") + '" onclick="cambiarPagina(' + p + ')">' + p + '</button>';
  });

  html += '<button class="btn-pagina" onclick="cambiarPagina(' + (paginaActual + 1) + ')" ' +
          (paginaActual === totalPaginas ? "disabled" : "") + ' aria-label="Página siguiente">&#8250;</button>';

  cont.innerHTML = html;
}

function cambiarPagina(n){
  paginaActual = n;
  pintarPaginaListado();
  document.getElementById("contenido-listado").scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------- estadísticas: cuántos coches hay por marca y por año ---------- */
function renderizarEstadisticas(){
  const porMarca = {};
  const porAnio = {};
  coches.forEach(c => {
    if(c.marca) porMarca[c.marca] = (porMarca[c.marca] || 0) + 1;
    if(c.anio) porAnio[c.anio] = (porAnio[c.anio] || 0) + 1;
  });

  const listaMarcas = Object.entries(porMarca).sort((a, b) => b[1] - a[1])
    .map(([nombre, total]) => '<span class="chip-stat">' + nombre + '<b>' + total + '</b></span>').join("");
  const listaAnios = Object.entries(porAnio).sort((a, b) => a[0] - b[0])
    .map(([nombre, total]) => '<span class="chip-stat">' + nombre + '<b>' + total + '</b></span>').join("");

  document.getElementById("panel-estadisticas").innerHTML =
    '<div class="stat-grupo"><h4>Coches por marca</h4><div class="stat-lista">' + (listaMarcas || '<span class="chip-stat">Sin datos todavía</span>') + '</div></div>' +
    '<div class="stat-grupo"><h4>Coches por año</h4><div class="stat-lista">' + (listaAnios || '<span class="chip-stat">Sin datos todavía</span>') + '</div></div>';
}

/* ---------- sonido de acelerón al abrir una ficha ---------- */
function sonidoAceleron(){
  const audio = document.getElementById("audio-motor");
  if(!audio) return;
  audio.currentTime = 0;
  audio.play().catch(() => {
    /* si el navegador bloquea el audio (por ejemplo al cargar la página
       sin ninguna interacción previa), no pasa nada: la ficha se abre igual */
  });
}

/* ---------- ficha ---------- */
function abrirFicha(id){
  const indice = listaActual.findIndex(c => c.id === id);
  pintarFicha(indice >= 0 ? indice : 0);
  mostrarVista("ficha");
}

function pintarFicha(indice){
  const coche = listaActual[indice];
  if(!coche) return;

  cocheFichaActualId = coche.id;
  sonidoAceleron();

  const fav = esFavorito(coche.id);
  const meta = [];
  if(coche.marca) meta.push('<span class="chip">' + coche.marca + '</span>');
  if(coche.serie) meta.push('<span class="chip dorado">' + coche.serie + '</span>');
  if(coche.anio) meta.push('<span class="chip">' + coche.anio + '</span>');
  if(coche.colorNombre) meta.push('<span class="chip color-chip"><span class="punto-color" style="background:' + (coche.color || "#999999") + '"></span>' + coche.colorNombre + '</span>');

  document.getElementById("ficha-contenedor").innerHTML =
    '<div class="tarjeta-ficha">' +
      '<div class="ficha-foto-wrap">' +
        '<button class="btn-estrella-ficha' + (fav ? ' activa' : '') + '" id="btn-favorito-ficha" onclick="alternarFavorito(' + coche.id + ')" aria-label="Marcar como favorito">' + (fav ? "\u2605" : "\u2606") + '</button>' +
        '<img src="' + fotoDe(coche) + '" alt="Foto de ' + coche.nombre + '">' +
      '</div>' +
      '<div class="ficha-cuerpo">' +
        '<h2 class="ficha-nombre">' + coche.nombre + '</h2>' +
        '<div class="chips">' + meta.join("") + '</div>' +
        '<div class="ficha-resena"><h3>Sobre esta pieza</h3><p>' + (coche.resena || "Todavía no has añadido una reseña para este coche.") + '</p></div>' +
      '</div>' +
    '</div>';

  document.getElementById("btn-ficha-anterior").disabled = (indice === 0);
  document.getElementById("btn-ficha-siguiente").disabled = (indice === listaActual.length - 1);
  document.getElementById("btn-ficha-anterior").onclick = () => pintarFicha(indice - 1);
  document.getElementById("btn-ficha-siguiente").onclick = () => pintarFicha(indice + 1);
}

});

window.addEventListener("scroll", () => {

botonArriba.addEventListener("click", () => {
  window.scrollTo({top: 0, behavior: "smooth"});
});

cargarFavoritos();
cargarModoOscuro();
poblarFiltros();
construirEscenario3D();
mostrarVista("home");
